---
- name: touch a windows file
  hosts: all

  tasks:
  - name: Create directory structure
    ansible.windows.win_file:
    path: C:\Temp\
    state: directory
    
  - name: Touch a file (creates if not present, updates modification time if present)
    ansible.windows.win_file:
      path: C:\Temp\foo.conf
      state: touch
